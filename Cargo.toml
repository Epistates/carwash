[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/carwash"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Nicholas Paterno <nick@epistates.com>"]
license = "MIT"
homepage = "https://github.com/epistates/carwash"
repository = "https://github.com/epistates/carwash"

[workspace.dependencies]
carwash-core = { version = "0.4.0", path = "crates/carwash-core" }

# Engine
rayon = "1.12"
crossbeam-channel = "0.5"
dashmap = "6.1"
globset = "0.4"
remove_dir_all = { version = "1.0", features = ["parallel"] }
trash = "5.2"
fs4 = "1.1"
etcetera = "0.11"
filetime = "0.2"

# Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
toml_edit = "0.25"
yaml_serde = "0.10"
semver = { version = "1.0", features = ["serde"] }
cargo-lock = "11.1"
jiff = { version = "0.2", features = ["serde"] }

# Errors, logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI / TUI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-input = "0.15"
nucleo-matcher = "0.3"
unicode-width = "0.2"
humantime = "2.2"
indicatif = "0.18"
anstream = "1.0"
anstyle = "1.0"

# Async, processes, network
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
portable-pty = "0.9"
vt100 = "0.16"
tui-term = "0.3"
process-wrap = { version = "10.0", features = ["std"] }
shlex = "2.0"

# Testing
tempfile = "3.27"
insta = "1.48"
assert_cmd = "2.2"
predicates = "3.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
