lockfiles = ["package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml", "bun.lock", "bun.lockb"]
adapter = "node"
artifacts = [
  { path = "node_modules", kind = "dependencies", global = true, regenerate = "reinstall with your package manager" },
  { path = ".next", kind = "build", regenerate = "next build / next dev" },
  { path = ".nuxt", kind = "build", regenerate = "nuxt build" },
  { path = ".output", kind = "build", confirm = ["nitro.json", "server", "public"], require_confirm = true, regenerate = "nuxt/nitro build" },
  { path = ".svelte-kit", kind = "build", regenerate = "vite build" },
  { path = ".turbo", kind = "cache", regenerate = "turbo run" },
  { path = ".nx/cache", kind = "cache", regenerate = "nx run" },
  { path = ".nx/workspace-data", kind = "cache", regenerate = "nx run" },
  { path = ".parcel-cache", kind = "cache", regenerate = "parcel build" },
  { path = ".angular/cache", kind = "cache", regenerate = "ng build" },
  { path = ".expo", kind = "cache", regenerate = "expo start" },
  { path = ".docusaurus", kind = "build", regenerate = "docusaurus build" },
  { path = ".astro", kind = "cache", regenerate = "astro build" },
  { path = ".vercel/output", kind = "build", regenerate = "vercel build" },
  { path = ".pnpm-store", kind = "cache", regenerate = "pnpm install" },
  { path = ".yarn/cache", kind = "cache", ambiguous = true, regenerate = "yarn install" },
  { path = ".yarn/unplugged", kind = "dependencies", ambiguous = true, regenerate = "yarn install" },
  { path = ".cache", kind = "cache", ambiguous = true },
  { path = "storybook-static", kind = "build", regenerate = "build-storybook" },
  { path = "dist", kind = "build", ambiguous = true, regenerate = "your build script" },
  { path = "build", kind = "build", ambiguous = true, regenerate = "your build script" },
  { path = "out", kind = "build", ambiguous = true, regenerate = "your build script" },
  { path = "coverage", kind = "other", ambiguous = true, regenerate = "your test script" },
]
tasks = [
  { name = "install", run = ["{pm}", "install"] },
  { name = "outdated", run = ["{pm}", "outdated"] },
]

