# Built-in ecosystem rules.
#
# Users can add or override ecosystems in ~/.config/carwash/ecosystems.toml
# using the same schema; an entry with an existing `id` replaces the built-in.
#
# Ecosystem fields:
#   id, name, badge     identity; `badge` is a short label for narrow/ASCII UIs
#   markers             entry names (globs allowed, `a/b` paths allowed) that make a directory a project
#   weak_markers        like markers, but ignored inside an existing project of the same ecosystem
#                       (e.g. nested CMakeLists.txt or requirements.txt do not start new projects)
#   lockfiles           names of lockfiles, used for activity and dependency tooling
#   adapter             optional built-in content hook (names, workspaces, custom target dirs)
#
# Artifact fields:
#   path                relative to the project root; `/` separates segments; segments may be globs
#   kind                build | dependencies | cache | environment | other
#   anywhere            match at any depth below the project, not only at the root
#   global              also match outside any project (only for unmistakable names)
#   ambiguous           generic name (build, dist, bin, vendor...) that some repos commit; only
#                       deleted without review when git reports it ignored and untracked
#   confirm             globs; if any child entry matches, the directory is confirmed as an artifact
#   require_confirm     without a confirming child the directory is not treated as an artifact
#   regenerate          hint shown to the user about how the artifact comes back
#
# Task fields (standard commands offered for every project of the ecosystem):
#   name, run           task name and program + arguments; `{pm}` is the JS package manager
#   when / unless       only offer the task when a path exists / does not exist

schema = 1

[[ecosystem]]
id = "rust"
name = "Rust"
badge = "rs"
markers = ["Cargo.toml"]
lockfiles = ["Cargo.lock"]
adapter = "cargo"
artifacts = [
  { path = "target", kind = "build", confirm = ["CACHEDIR.TAG", ".rustc_info.json", "debug", "release"], regenerate = "cargo build" },
]
tasks = [
  { name = "build", run = ["cargo", "build"] },
  { name = "test", run = ["cargo", "test"] },
  { name = "check", run = ["cargo", "check", "--all-targets"] },
  { name = "clippy", run = ["cargo", "clippy", "--all-targets"] },
  { name = "fmt", run = ["cargo", "fmt"] },
  { name = "doc", run = ["cargo", "doc"] },
  { name = "update", run = ["cargo", "update"], description = "update Cargo.lock within semver" },
  { name = "clean", run = ["cargo", "clean"] },
]

[[ecosystem]]
