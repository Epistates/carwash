[[ecosystem]]
id = "python"
name = "Python"
badge = "py"
markers = ["pyproject.toml", "setup.py", "Pipfile", "uv.lock", "poetry.lock", "pdm.lock", "pixi.toml", "hatch.toml"]
weak_markers = ["requirements*.txt", "setup.cfg", "tox.ini", "noxfile.py", "environment.yml"]
lockfiles = ["uv.lock", "poetry.lock", "pdm.lock", "Pipfile.lock", "pixi.lock"]
adapter = "python"
artifacts = [
  { path = ".venv", kind = "environment", confirm = ["pyvenv.cfg", "conda-meta"], require_confirm = true, regenerate = "uv sync / poetry install / python -m venv" },
  { path = "__pycache__", kind = "cache", anywhere = true, global = true, regenerate = "automatic" },
  { path = ".pytest_cache", kind = "cache", anywhere = true, global = true, regenerate = "automatic" },
  { path = ".mypy_cache", kind = "cache", anywhere = true, global = true, regenerate = "mypy" },
  { path = ".ruff_cache", kind = "cache", anywhere = true, global = true, regenerate = "ruff" },
  { path = ".pytype", kind = "cache", regenerate = "pytype" },
  { path = ".pyre", kind = "cache", regenerate = "pyre" },
  { path = ".hypothesis", kind = "cache", anywhere = true, regenerate = "hypothesis" },
  { path = ".tox", kind = "environment", regenerate = "tox" },
  { path = ".nox", kind = "environment", regenerate = "nox" },
  { path = ".pixi", kind = "environment", regenerate = "pixi install" },
  { path = "__pypackages__", kind = "dependencies", regenerate = "pdm install" },
  { path = ".eggs", kind = "build", regenerate = "setuptools" },
  { path = "*.egg-info", kind = "build", anywhere = true, regenerate = "pip install -e ." },
  { path = "htmlcov", kind = "other", regenerate = "coverage html" },
  { path = ".ipynb_checkpoints", kind = "cache", anywhere = true, ambiguous = true, regenerate = "jupyter autosave" },
  { path = "build", kind = "build", ambiguous = true, confirm = ["lib", "lib.*", "bdist.*", "temp.*"], regenerate = "python -m build" },
  { path = "dist", kind = "build", ambiguous = true, confirm = ["*.whl", "*.tar.gz"], regenerate = "python -m build" },
]
tasks = [
  { name = "sync", run = ["uv", "sync"], when = "uv.lock" },
  { name = "test", run = ["uv", "run", "pytest"], when = "uv.lock" },
  { name = "install", run = ["poetry", "install"], when = "poetry.lock" },
  { name = "test", run = ["poetry", "run", "pytest"], when = "poetry.lock" },
  { name = "install", run = ["pdm", "install"], when = "pdm.lock" },
]

